name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: for file in src/*.js scripts/*.js; do node --check "$file"; done
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tigerapps-discord-bot-production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::104733724423:role/TigerAppsDiscordBotDeployRole
          aws-region: us-east-1
          allowed-account-ids: '104733724423'
      - name: Deploy bot
        run: |
          set -euo pipefail
          bucket=tigerapps-discord-bot-deploy-104733724423-us-east-1
          archive="s3://$bucket/releases/$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --output=/tmp/tigerapps-discord-bot.tar.gz HEAD
          checksum=$(sha256sum /tmp/tigerapps-discord-bot.tar.gz | cut -d' ' -f1)
          aws s3 cp /tmp/tigerapps-discord-bot.tar.gz "$archive" --only-show-errors
          url=$(aws s3 presign "$archive" --expires-in 600)
          parameters=$(jq -n --arg sha "$GITHUB_SHA" --arg checksum "$checksum" --arg url "$url" \
            '{ReleaseSha:[$sha],Sha256:[$checksum],ArtifactUrl:[$url]}')
          command_id=$(aws ssm send-command --instance-ids i-0b2bfc5624ab3f9bf \
            --document-name TigerAppsDiscordBotDeploy --parameters "$parameters" \
            --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$command_id" --instance-id i-0b2bfc5624ab3f9bf; then
            aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0b2bfc5624ab3f9bf \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 2 https://api.tigerapps.org/health
